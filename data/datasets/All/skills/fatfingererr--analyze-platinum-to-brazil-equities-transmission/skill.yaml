bestPractices:
  - title: 使用週頻而非日頻
    description: 長週期傳導分析（跨資產、跨國）建議使用 1wk 頻率，避免日頻噪音干擾領先落後判斷
  - title: Inner join 對齊
    description: 白金期貨與 EWZ 交易日不完全重疊，使用 inner join 避免 ffill/interpolate 造成假相關
  - title: 同時觀察 rolling corr 與 lead-lag
    description: 領先落後關係可能隨時間變化，配合 rolling correlation 觀察關聯的穩定性

pitfalls:
  - title: 過度解讀單一 lead-lag 數值
    description: 最佳 lag 可能不穩定，不同子期間可能得出不同結果
    consequence: 誤以為傳導結構穩固，實際上具有 regime-dependent 性質
  - title: 忽略巴西特有風險
    description: 巴西股市受政治風險、匯率（BRL）、大宗商品結構等多重因素影響
    consequence: 將 EWZ 走勢全歸因於白金，忽略更重要的本地驅動因素
  - title: 混淆相關與因果
    description: 交叉相關只顯示統計關聯，不代表白金「驅動」巴西股市
    consequence: 錯誤地將統計領先解讀為因果關係

faq:
  - question: 為什麼選擇 EWZ 而非巴西 Bovespa 指數？
    answer: |
      EWZ（iShares MSCI Brazil ETF）是美國上市的巴西股市 ETF，
      使用 EWZ 的優勢：
      - Yahoo Finance 可直接取得長期歷史資料
      - 以美元計價，與白金（美元計價）直接可比
      - 流動性高，價格反映充分
      若需要本地貨幣計價，可考慮 ^BVSP（Bovespa 指數）。

  - question: 白金與巴西股市為什麼可能有關聯？
    answer: |
      潛在傳導機制：
      1. **商品週期共振**：白金是工業/貴金屬，巴西是大宗商品出口國
      2. **全球風險偏好**：兩者都對全球成長預期敏感
      3. **新興市場資金流**：商品上行週期時，資金流入新興市場
      4. **美元效應**：美元走弱時，商品和新興市場同時受益

      但注意：這些是假說而非已證因果，本技能的目的就是量化檢驗。

  - question: 分析結果顯示「decoupled」代表什麼？
    answer: |
      decoupled（脫鉤）表示白金與 EWZ 在當前 regime_window 內
      趨勢方向不一致，可能原因：
      - 巴西特有風險（政治危機、匯率大幅貶值）
      - 白金供給面衝擊（礦業罷工、南非問題）
      - 全球資金流向改變（如資金轉向其他新興市場）

      decoupled 不代表「永久失效」，可能是暫時性的 regime break。

