testQuestions:
  - question: '白金走勢是否領先巴西股市？兩者的長期傳導關係如何？'
    imagePath: images/platinum-vs-ewz-2026-01-29.png
    expectedResult: |
      白金 vs 巴西股市（EWZ）傳導分析報告                                                                                                                                                                                                                                 
      
      白金與巴西股市在 23 年週頻數據上呈現同步正相關（非領先落後），傳導強度分數 75.6/100，目前處於 linked_upcycle 
      體制。兩者更像是受共同宏觀因子（新興市場風險偏好、美元、商品超級週期）驅動的「同類資產」，而非白金單向領先巴西股市。

      ---
      量化證據
      ┌────────────────────────────────┬─────────────────────┬──────────────────────────┐
      │              指標              │        數值         │           解讀           │
      ├────────────────────────────────┼─────────────────────┼──────────────────────────┤
      │ 最佳 Lag                       │ 0 週 (corr = 0.407) │ 同步移動，白金不領先 EWZ │
      ├────────────────────────────────┼─────────────────────┼──────────────────────────┤
      │ 52W Rolling Corr（最新）       │ 0.306               │ 正但偏低（歷史中位偏下） │
      ├────────────────────────────────┼─────────────────────┼──────────────────────────┤
      │ Rolling Corr 正值佔比（全期）  │ 98.0%               │ 幾乎全期正相關           │
      ├────────────────────────────────┼─────────────────────┼──────────────────────────┤
      │ Rolling Corr 正值佔比（近5年） │ 98.1%               │ 近期同樣穩定正相關       │
      ├────────────────────────────────┼─────────────────────┼──────────────────────────┤
      │ 趨勢一致性（近104週）          │ 71.8%               │ 超過七成時間趨勢方向相同 │
      ├────────────────────────────────┼─────────────────────┼──────────────────────────┤
      │ Regime                         │ linked_upcycle      │ 兩者趨勢同向上行         │
      ├────────────────────────────────┼─────────────────────┼──────────────────────────┤
      │ 傳導強度分數                   │ 75.6/100            │ 強傳導（≥70 門檻）       │
      └────────────────────────────────┴─────────────────────┴──────────────────────────┘
      ---
      關鍵發現

      1. 不是「領先」而是「同步」：交叉相關在 lag=0 達到峰值
      0.407，白金並未系統性地領先巴西股市。兩者更可能被共同的宏觀驅動因子（如全球風險偏好、美元走勢、商品週期）同時推動。
      2. 長期正相關極為穩定：52 週 rolling correlation 在全部 23 年中有 98% 的時間維持正值。這說明兩者的連動是結構性的，而非偶發性的。 
      3. 正規化走勢差異大：從 2003 年 base=100 看，白金累積漲至約 400，EWZ 曾達 1100+（2008 前）但目前約 500。EWZ
      的波動率遠高於白金，受巴西本國因素（匯率、政治風險）影響更大。
      4. 當前處於 linked_upcycle：近 2 年兩者趨勢一致性 71.8%，相關係數 0.32，目前同向上行。

      ---
      監控清單

      - 52 週 rolling corr 目前為正 (0.306)，需維持正值至少 26 週作為傳導持續的確認
      - 若白金大漲而 EWZ 不動且 corr 轉負，視為 regime break（脫鉤信號）
      - 注意：由於 lag=0（同步），白金走勢不能作為 EWZ 的領先指標使用

      資料限制

      - 資料範圍：2003-01-08 ~ 2026-01-21，共 1,086 筆週頻觀測
      - EWZ 是美元計價 ETF，包含巴西雷亞爾匯率效應
      - 白金期貨流動性低於黃金，極端行情可能失真
      - 相關性不等於因果關係；共同因子驅動的解釋比單向傳導更合理

      圖表已存至：output/platinum_vs_ewz_2026-01-29.png

  - question: '目前白金與巴西股市的相關性處於什麼狀態？'
    imagePath: images/platinum-vs-ewz-2026-01-29.png
    expectedResult: |
      白金（PL=F）→ 巴西股市（EWZ）傳導狀態報告   

      分析日期: 2026-01-29 | 資料區間: 2003-01-03 ~ 2026-01-30（週頻，1,090 筆）                                                          
      ---                                                                                                                              
      當前狀態：linked_upcycle（傳導結構活躍）  
      ┌───────────────────────────────┬───────────────────────┬────────────────────────┐
      │             指標              │         數值          │          解讀          │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ 傳導強度分數                  │ 78.3 / 100            │ 中高強度               │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ Signal                        │ transmission_moderate │ 中度傳導               │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ 最佳 Lag                      │ 0 週                  │ 同步移動（非領先落後） │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ 最佳相關係數                  │ 0.4562                │ 中度正相關             │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ 52 週 Rolling Corr（最新）    │ 0.280                 │ 正值但偏低             │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ 近 5 年 Rolling Corr 正值佔比 │ 100%                  │ 全期正相關             │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ 最長連續正值                  │ 433 週（約 8.3 年）   │ 極為穩定               │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ 趨勢一致性                    │ 71.8%                 │ 超過 60% 門檻          │
      ├───────────────────────────────┼───────────────────────┼────────────────────────┤
      │ EWZ 近 2 年累積報酬           │ +32.6%                │ 上行中                 │
      └───────────────────────────────┴───────────────────────┴────────────────────────┘
      ---
      關鍵發現

      1. 同步而非領先：最佳 lag = 0，白金與 EWZ
      主要是「共同移動」而非白金領先。兩者共享的驅動因子（全球風險偏好、美元、新興市場資金流）可能才是真正的公因子。
      2. 傳導結構仍然活躍：近 5 年 rolling correlation 100% 時間為正，最長連續正值達 433 週。雖然最新值 0.280 偏低（歷史高峰曾超過     
      0.7），但尚未跌入負值。
      3. Regime = linked_upcycle：趨勢一致性 71.8%，兩者均處於上行趨勢，傳導結構未斷裂。

      ---
      分數拆解
      ┌────────────────────────┬────────┬──────┬──────────┐
      │          維度          │ 原始分 │ 權重 │ 加權貢獻 │
      ├────────────────────────┼────────┼──────┼──────────┤
      │ 最佳相關（0.456）      │ 65.2   │ 30%  │ 19.6     │
      ├────────────────────────┼────────┼──────┼──────────┤
      │ Rolling 穩定性（100%） │ 100.0  │ 30%  │ 30.0     │
      ├────────────────────────┼────────┼──────┼──────────┤
      │ 趨勢一致性（71.8%）    │ 71.8   │ 40%  │ 28.7     │
      ├────────────────────────┼────────┼──────┼──────────┤
      │ 合計                   │        │      │ 78.3     │
      └────────────────────────┴────────┴──────┴──────────┘
      Rolling 穩定性拿滿分，是拉高總分的主因；相關係數本身（0.456）只算中等。

      ---
      監控重點

      - 52 週 rolling corr 需維持正值至少 26 週才算確認
      - 若白金大漲而 EWZ 不動且 corr 轉負 → 視為 regime break（巴西特有風險主導）
      - 目前 rolling corr 0.280 處於偏低水位，需關注是否持續走弱

